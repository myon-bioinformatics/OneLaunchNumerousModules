[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-launch-numerous-modules"
version = "0.6.0"
description = "Single-file bash/zsh one-liners, standard-library tool launcher, and dial for closed networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olnm = "olnm:main"

[tool.setuptools]
py-modules = ["olnm"]

[dependency-groups]
stdlib-test = ["pytest>=8", "pyyaml>=6"]
