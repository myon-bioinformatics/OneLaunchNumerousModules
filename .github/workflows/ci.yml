name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test shell, calculator, and uv lifecycle
        env:
          OLNM_TEST_UV: '1'
        run: uv run --no-project python -m unittest discover -v
      - name: Smoke test the pinned ONTO launcher
        run: |
          python olnm.py onto --help
          python olnm.py onto versions --json > "$RUNNER_TEMP/onto-versions.json"
          python -c 'import json, sys; assert len(json.load(open(sys.argv[1]))["otl"]["commit"]) == 40' "$RUNNER_TEMP/onto-versions.json"
