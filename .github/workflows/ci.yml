name: CI
on:
  schedule:
    - cron: "37 21 * * *"  # 🔁 follow-main
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest
          python-version: ${{ matrix.python }}
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Test shell, calculator, and uv lifecycle
        env:
          OLNM_TEST_UV: '1'
        run: uv run --no-project python -m unittest discover -v
      - name: Smoke test the pinned ONTO launcher
        run: |
          python olnm.py onto --help
          python olnm.py onto versions --json > "$RUNNER_TEMP/onto-versions.json"
          python -c 'import json, sys; assert len(json.load(open(sys.argv[1]))["otl"]["commit"]) == 40' "$RUNNER_TEMP/onto-versions.json"
      - name: Smoke test Turtle piping online and from the warmed cache
        run: |
          set -o pipefail
          smoke_dir=$(mktemp -d)
          export DIAL_FILE="$smoke_dir/dial"
          export UV_CACHE_DIR="$smoke_dir/cache"
          export UV_TOOL_DIR="$smoke_dir/tools"
          unset UV_OFFLINE

          check_pipe() {
            printf '%s\n' '{"premises":[["OR",["NOT","cat"],"mammal"],"cat"],"conclusion":"mammal"}' |
              python olnm.py onto otl entails - --ttl |
              python olnm.py onto exchange query - 'ASK { ?check <urn:otl:verdict> <urn:otl:entailed> }' |
              python -c 'import json, sys; assert json.load(sys.stdin)["boolean"] is True'
          }

          for dial in 3 0 1; do
            printf '%s\n' "$dial" > "$DIAL_FILE"
            echo "Checking Turtle pipe at dial $dial"
            check_pipe
          done

          status=0
          printf '%s\n' '<urn:s> <urn:p> [' |
            python olnm.py onto exchange query - 'ASK { ?s ?p ?o }' \
              > "$smoke_dir/bad.out" 2> "$smoke_dir/bad.err" || status=$?
          test "$status" -eq 2
          test ! -s "$smoke_dir/bad.out"
          grep -F 'Invalid Turtle on stdin' "$smoke_dir/bad.err"

  # 🔁 own sources follow main: on schedule / manual run, take main of own repositories and push to main
  follow-main:
    if: github.event_name == 'schedule'
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-follow-main.yml@main
    permissions:
      contents: write
    with:
      node-version: "26"
      check: |
        uv run --no-project python -m unittest discover
