name: Pages

# 📖 docs/ is the hand-written 利用・検証ガイド (the front page). The parent's reusable workflow adds the usage guide
# from docs/guide.page.json under docs/guide/ (guide_dir), with 📚 機能全一覧 read from olnm.py. Pull requests
# build it; only main deploys.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "olnm.py"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@1962e42c110ac47f8a2581c71c93fc9ac21afb94
    with:
      artifact_path: docs
      # Stage Pages brand assets: the front page's favicons next to it
      build: |
        mkdir -p docs/assets/brand
        cp assets/brand/favicon.ico assets/brand/favicon.png docs/assets/brand/
      guide_page: docs/guide.page.json
      guide_dir: guide
      guide_brand: OneLaunchNumerousModules
