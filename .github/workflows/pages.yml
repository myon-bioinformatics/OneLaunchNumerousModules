name: Pages

# 📖 The parent's reusable workflow builds the 利用・検証ガイド from docs/guide.page.json with PySaiyanWeBoo, like every other
# guide: 🔬 検証ガイド (its 🤖 steps run in CI), 🧩 機能一覧 and 📚 機能全一覧 read from olnm.py; icon and favicon come from
# CaChereCyCle (guide_brand). Pull requests build it; only main deploys.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "olnm.py"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@27c46411c0a07d9b4d0f1ad5751ed1bb9e869b5c
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_brand: OneLaunchNumerousModules
